{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block title %}Access restricted | SecureRole{% endblock %}
{% block content %}
<section class="card login-card" aria-labelledby="restricted-title">
    <header class="login-heading">
        <span class="empty-icon restricted-icon">{{ icon("shield") }}</span>
        <h1 id="restricted-title">Access restricted</h1>
    </header>
    <p class="intro">You don't have permission to perform this action.</p>
    <a class="button primary" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
</section>
{% endblock %}
